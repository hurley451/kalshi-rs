name: KalshiCore Conformance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  schedule:
    - cron: '47 11 * * *'
  workflow_dispatch:

jobs:
  conformance:
    name: Run KalshiCore fixtures
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      CONFORMANCE_REPORT: kalshi-rs/artifacts/kalshicore-conformance/report.json

    steps:
      - name: Check out kalshi-rs
        uses: actions/checkout@v4
        with:
          path: kalshi-rs

      - name: Check out KalshiCore
        uses: actions/checkout@v4
        with:
          repository: hurley451/KalshiCore
          ref: ${{ github.event_name == 'schedule' && 'main' || 'da235871e8c55ca1f6bcc2020f5324e909f1998a' }}
          path: KalshiCore

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install locked generation dependencies
        working-directory: kalshi-rs
        run: |
          npm ci --prefix tools/probe-fixtures
          cargo fetch --locked --manifest-path tools/typed-generator/Cargo.toml
          cargo fetch --locked

      - name: Check generated operations
        working-directory: kalshi-rs
        run: |
          staged_operations="$(mktemp)"
          trap 'rm -f "$staged_operations"' EXIT
          node tools/generate_operations.mjs --kalshicore-root "$GITHUB_WORKSPACE/KalshiCore" --out "$staged_operations"
          cmp src/generated/operations.rs "$staged_operations"

      - name: Check typed generation reproducibility and preservation
        working-directory: kalshi-rs
        env:
          KALSHICORE_ROOT: ${{ github.workspace }}/KalshiCore
        run: |
          node tools/check_generated_typed.mjs
          node --test tools/check_generated_typed.test.mjs
          node --test tools/probe-fixtures/generate.test.mjs

      - name: Test
        working-directory: kalshi-rs
        run: cargo test --locked

      - name: Run conformance adapter
        id: conformance
        working-directory: kalshi-rs
        run: >-
          cargo run --locked --bin kalshicore-conformance --
          --kalshicore-root "$GITHUB_WORKSPACE/KalshiCore"
          --report artifacts/kalshicore-conformance/report.json

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalshicore-conformance-report
          path: ${{ env.CONFORMANCE_REPORT }}
          if-no-files-found: warn

      - name: File KalshiCore contract gap
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.KALSHICORE_ISSUE_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "KALSHICORE_ISSUE_TOKEN is not configured; skipping parent issue filing."
            exit 0
          fi

          title="Contract gap: kalshi-rs scheduled conformance drift"
          existing="$(gh issue list --repo hurley451/KalshiCore --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          body_file="$(mktemp)"
          {
            echo "## Summary"
            echo "kalshi-rs scheduled generation or conformance checks failed against KalshiCore main."
            echo
            echo "## Source links"
            echo "- Run: $RUN_URL"
            echo
            echo "## Affected SDK target"
            echo "- rust.kalshi-rs"
            echo
            echo "## Evidence"
            if [ -f "$CONFORMANCE_REPORT" ]; then
              echo '```json'
              cat "$CONFORMANCE_REPORT"
              echo '```'
            else
              echo "- No conformance report artifact was written."
            fi
            echo
            echo "## Acceptance criteria"
            echo "- Determine whether the failure belongs in KalshiCore contracts/fixtures or kalshi-rs implementation."
            echo "- Update the affected repo and restore scheduled conformance."
          } > "$body_file"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo hurley451/KalshiCore --body-file "$body_file"
          else
            gh issue create --repo hurley451/KalshiCore --title "$title" --label contract-gap --body-file "$body_file"
          fi
