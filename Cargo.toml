[package]
name = "kalshi_rs"
version = "0.1.0"
edition = "2024"
description = "Rust SDK target for KalshiCore conformance"
license = "MIT"
repository = "https://github.com/hurley451/kalshi-rs"

[dependencies]
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rsa = { version = "0.9", features = ["pem", "sha2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
